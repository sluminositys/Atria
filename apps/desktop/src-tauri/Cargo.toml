[package]
name = "atria"
version = "0.2.0"
description = "A desktop-first HTML artifact workspace."
authors = ["Atria"]
edition = "2021"
default-run = "atria"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
git2 = { version = "0.21", features = ["vendored-libgit2"] }
regex = "1"
rfd = { version = "0.15", default-features = false }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "atria-mcp"
path = "src/bin/atria-mcp.rs"
